<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <meta name="description" content="We couldn't find that page. Return to open-launcher.">
    <title>Page not found - open-launcher</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header" aria-label="Site header">
        <a class="wordmark" href="/" aria-label="open-launcher home">
          <span class="wordmark-symbol" aria-hidden="true"><img src="assets/white-mode-logo.png" alt=""></span>
          <span>open-<span class="wordmark-light">launcher</span></span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="pricing">Pricing</a>
          <a href="stack">Our stack</a>
        </nav>
      </header>

      <section class="not-found" aria-labelledby="page-title">
        <div class="not-found-copy">
          <p class="not-found-code">404 · PAGE NOT FOUND</p>
          <h1 id="page-title">This page isn’t here.</h1>
          <p class="not-found-description">The address may be wrong, or the page may have moved. Let’s get you back to open-launcher.</p>
          <a class="primary-button" href="/">Back to open-launcher</a>
        </div>
      </section>

      <footer class="site-footer">
        <span>© 2026 open-launcher</span>
        <span>Free to use · Built in the open</span>
      </footer>
    </main>
  </body>
</html>
